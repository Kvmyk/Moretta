services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: privateproxy-backend
    # Bound to loopback: the API must only be reachable through the frontend
    # proxy, which terminates auth and enforces the upload size limit.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - privateproxy-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:3000/auth}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-moretta}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-moretta-frontend}
    container_name: privateproxy-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - keycloak
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - privateproxy-net

  ollama:
    image: ollama/ollama
    container_name: privateproxy-ollama
    # Ollama has no authentication of its own — keep it off the host network.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - privateproxy-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: privateproxy-keycloak
    command: start-dev --import-realm --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: http://localhost:3000
      KC_HOSTNAME_ADMIN: http://localhost:8080/auth
      KC_HTTP_RELATIVE_PATH: /auth
    volumes:
      - ./keycloak/realm-moretta.json:/opt/keycloak/data/import/realm-moretta.json:ro
      - ./keycloak/themes/moretta:/opt/keycloak/themes/moretta:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    networks:
      - privateproxy-net

volumes:
  ollama_data:

networks:
  privateproxy-net:
    driver: bridge
